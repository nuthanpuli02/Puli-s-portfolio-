<title>Moss Forest Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
/* One full-screen 3D view; title and state at the top, controls at the bottom, a tweak sheet that slides up over the scene. */
:root{
  --ink:#F2F4EE; --soft:rgba(242,244,238,.72); --bar:rgba(12,16,13,.66); --line:rgba(242,244,238,.16);
  --accent:#D21319; --on:#fff; --grid:#00FF41; --bg:#000;
  --display:"Playfair Display", Georgia, serif; --sans:"Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;margin:0}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
h1{margin:0;font:500 clamp(20px,5vw,28px)/1.1 var(--display);text-shadow:0 1px 12px rgba(0,0,0,.5)}
.state{font:600 11px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);text-align:right;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0))}
button{appearance:none;border:1px solid var(--line);background:var(--bar);color:var(--ink);border-radius:999px;min-height:44px;padding:0 16px;
  font:500 14px/1 var(--sans);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button[aria-pressed="true"]{border-color:var(--ink)}
button.go{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.load{position:fixed;inset:0;display:grid;place-items:center;color:var(--soft);font-size:14px;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:62vh;overflow:auto;background:rgba(10,13,11,.9);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .25s ease;box-sizing:border-box}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet h2{margin:0;font:600 15px/1.2 var(--sans)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row label{font-size:14px}
.row output{font:600 13px/1.4 var(--sans);color:var(--soft);font-variant-numeric:tabular-nums}
.row input{grid-column:1/-1;width:100%;accent-color:var(--grid);height:28px}
.note{font-size:12px;color:var(--soft);margin:10px 0 0;line-height:1.4}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>

<div class="top"><h1>Moss forest</h1><div class="state" id="state">Loading</div></div>
<div class="load" id="load">Growing the moss…</div>
<div class="bar" id="bar">
  <button id="day" aria-pressed="true">Day</button>
  <button id="night" aria-pressed="false">Night</button>
  <button id="tweak" aria-expanded="false" aria-controls="sheet">Tweak</button>
  <button id="landing" class="go">Play the landing</button>
</div>
<section class="sheet" id="sheet" aria-label="Tweaks">
  <header><h2>Tweaks</h2><button id="close">Done</button></header>
  <div id="rows"></div>
  <p class="note">Tell me the numbers you like and I'll use them on the site. Drag the scene to look around.</p>
</section>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
// The old site's moss forest (src/puli3d.js) rebuilt in three.js: the same layout (arch behind, diagonal branch, two giant
// trunks by the landing spot, mounds, log, far trunks in fog), the same moss "shells" (each mossy surface drawn again in
// layers pushed outwards, with strands cut out), now over real bark/rock textures, plus grass, bushes, ferns and flowers.
// The landing: black -> he lands -> shockwave 1 draws the forest as a green grid -> as he gets up, shockwave 2 brings in
// the textures and thickens the fog.
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {mergeGeometries,mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';

const $=id=>document.getElementById(id);
const PHONE=Math.min(innerWidth,innerHeight)<700;
const R=new THREE.WebGLRenderer({antialias:true});
document.body.prepend(R.domElement);
R.setPixelRatio(Math.min(devicePixelRatio,PHONE?1.5:1.75));R.outputColorSpace=THREE.SRGBColorSpace;
R.toneMapping=THREE.ACESFilmicToneMapping;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#000');
scene.fog=new THREE.FogExp2('#a9bf98',0.0);
const cam=new THREE.PerspectiveCamera(50,1,0.05,200);

function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(23);

// ---------- settings (the tweak sheet) ----------
const SET={mossLen:0.09,shells:6,curl:0.5,grassH:0.18,grass:0.5,fog:0.8,w1:3.5,w2:3.5};   // Puli's numbers (2026-10-28)
const ROWS=[
  ['mossLen','Moss length',0.02,0.16,0.005,v=>v.toFixed(3)],
  ['shells','Moss layers',4,20,1,v=>v],
  ['curl','Layer shift',0,1,0.05,v=>v.toFixed(2)],
  ['grassH','Grass height',0.04,0.22,0.005,v=>v.toFixed(3)],
  ['grass','Grass amount',0.1,1,0.05,v=>Math.round(v*100)+'%'],
  ['fog','Fog',0,2.5,0.05,v=>v.toFixed(2)+'×'],
  ['w1','Shockwave 1 (grid)',1,5,0.1,v=>v.toFixed(1)+' s'],
  ['w2','Shockwave 2 (textures + fog)',1,6,0.1,v=>v.toFixed(1)+' s'],
];

// ---------- shared uniforms: lights, fog, and the landing's two shockwaves ----------
// uSeq 1 while the landing plays; uW1 = radius of shockwave 1 (inside: green grid), uW2 = radius of shockwave 2 (inside:
// the real look); outside uW1 nothing is drawn (black). Radii are measured from uCenter, where he lands.
const G={
  uSeq:{value:0},uW1:{value:0},uW2:{value:0},uCenter:{value:new THREE.Vector3()},uTime:{value:0},
  uFogD:{value:0},uFogC:{value:new THREE.Color()},uNight:{value:0},
  uSunDir:{value:new THREE.Vector3(0.4,0.8,0.35).normalize()},uSunC:{value:new THREE.Color()},
  uSkyC:{value:new THREE.Color()},uGndC:{value:new THREE.Color()},
  uMossLen:{value:SET.mossLen},uShells:{value:SET.shells},uCurl:{value:SET.curl},uGrassH:{value:SET.grassH},
};
const WAVE_GLSL=`
uniform float uSeq,uW1,uW2;uniform vec3 uCenter;
float gl1(vec2 p){ vec2 w=fwidth(p); vec2 g=abs(fract(p-0.5)-0.5)/max(w,1e-4);
  float l=1.0-min(min(g.x,g.y),1.0); return l*(1.0-smoothstep(0.18,0.45,max(w.x,w.y))); }   // fade lines that get too dense
float gridLines(vec3 wp,vec3 wn){ vec3 an=abs(normalize(wn)); an/=(an.x+an.y+an.z); float s=2.5;
  return gl1(wp.yz*s)*an.x+gl1(wp.xz*s)*an.y+gl1(wp.xy*s)*an.z; }
// returns the colour to show; real = the normal look of this fragment
vec3 waves(vec3 real,vec3 wp,vec3 wn,float lineK){
  if(uSeq<0.5) return real;
  float d=distance(wp,uCenter);
  if(d>uW1) discard;
  vec3 green=vec3(0.0,1.0,0.255);
  float line=gridLines(wp,wn)*lineK;
  vec3 grid=green*(0.03+0.85*line);
  float inside=1.0-smoothstep(uW2-0.3,uW2,d);
  float t1=0.08+uW1*0.012, t2=0.10+uW2*0.012;
  float r1=exp(-pow((d-uW1)/t1,2.0)), r2=exp(-pow((d-uW2)/t2,2.0))*step(0.01,uW2);
  return mix(grid,real,inside)+green*(r1*1.9+r2*1.3);
}`;

// ---------- textures ----------
const TL=new THREE.TextureLoader();
function set(name){
  const f=k=>{const t=TL.load(`tex/${name}_${k}.webp`);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;if(k==='col')t.colorSpace=THREE.SRGBColorSpace;return t};
  return{map:f('col'),normalMap:f('nrm'),orm:f('orm')}}
function mat(name,rep,extra={}){const s=set(name);for(const t of Object.values(s))t.repeat.set(rep[0],rep[1]);
  return new THREE.MeshStandardMaterial({map:s.map,normalMap:s.normalMap,roughnessMap:s.orm,aoMap:s.orm,aoMapIntensity:0.9,roughness:1,metalness:0,...extra})}

// the waves patch for every standard material (bark, rock, ground, leaves, ferns)
function wave(m,{sway=0,lineK=1,sky=false}={}){
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,G);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nuniform float uTime;varying vec3 vWP;varying vec3 vWN;')
      .replace('#include <begin_vertex>',`#include <begin_vertex>
        ${sway?`{ vec4 ip=vec4(0.0,0.0,0.0,1.0);
          #ifdef USE_INSTANCING
            ip=instanceMatrix*ip;
          #endif
          float k=${sway.toFixed(3)}*(0.6+0.4*sin(ip.x*1.7+ip.z*1.3));
          transformed.x+=k*sin(uTime*1.6+ip.x*0.9+ip.y*0.7); transformed.z+=k*0.6*cos(uTime*1.3+ip.z*0.8); }`:''}`)
      .replace('#include <worldpos_vertex>',`#include <worldpos_vertex>
        { vec4 wp=vec4(transformed,1.0); vec3 n=${sky?'vec3(0.0,1.0,0.0)':'objectNormal'};
          #ifdef USE_INSTANCING
            wp=instanceMatrix*wp; n=mat3(instanceMatrix)*n;
          #endif
          wp=modelMatrix*wp; vWP=wp.xyz; vWN=normalize(mat3(modelMatrix)*n); }`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vWP;varying vec3 vWN;\n'+WAVE_GLSL)
      .replace('#include <dithering_fragment>',`#include <dithering_fragment>
        ${sky?`if(uSeq>0.5&&distance(vWP,uCenter)>uW2) discard;`:
             `gl_FragColor.rgb=waves(gl_FragColor.rgb,vWP,vWN,${lineK.toFixed(2)});`}`);
  };
  m.customProgramCacheKey=()=>'w'+sway+lineK+sky;
  return m;
}

const M={
  ground:wave(mat('ground',[14,14])),
  bark:wave(mat('bark',[3,0.45])),
  bark2:wave(mat('bark2',[3,0.45])),
  far:wave(new THREE.MeshStandardMaterial({color:'#3b4536',roughness:1})),
  mound:wave(mat('mossrock',[3,2])),
  mossrock:wave(mat('mossrock',[1.5,1.5])),
  rock:wave(mat('rock',[1.5,1.5])),
  vine:wave(mat('bark2',[1,0.6],{color:new THREE.Color('#8aa064')})),
};

// ---------- the ground ----------
const LAND=new THREE.Vector3(0,0,0.3);
const groundY=(x,z)=>{const path=Math.exp(-((z-0.3)*(z-0.3))/(1.6*1.6))*Math.exp(-(x*x)/(9*9));
  return (Math.sin(x*0.32)*Math.cos(z*0.4)*0.35+Math.sin(x*0.9+z*0.6)*0.12)*(1-path)};
const world=new THREE.Group();scene.add(world);
{const g=new THREE.PlaneGeometry(120,120,160,160);g.rotateX(-Math.PI/2);const p=g.attributes.position;
  for(let i=0;i<p.count;i++)p.setY(i,groundY(p.getX(i),p.getZ(i)));g.computeVertexNormals();
  const m=new THREE.Mesh(g,M.ground);m.receiveShadow=true;world.add(m)}

// ---------- shapes ----------
// a tapered tube along points; ends on the ground flare into roots with buttress ridges. aMoss = how mossy (0..1.3).
function tube(pts,r0,r1,{seg=60,rad=24,moss=1,vs=0.5,flare=true,seed=1}={}){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));
  const fr=curve.computeFrenetFrames(seg,false),P=[],N=[],U=[],A=[],I=[],L=curve.getLength();
  for(let i=0;i<=seg;i++){const t=i/seg,c=curve.getPointAt(t);
    for(let j=0;j<=rad;j++){const a=j/rad*Math.PI*2,n=fr.normals[i].clone().multiplyScalar(Math.cos(a)).add(fr.binormals[i].clone().multiplyScalar(Math.sin(a)));
      let r=r0+(r1-r0)*t;r*=1+0.08*Math.sin(t*11+seed)+0.05*Math.sin(t*29+seed*2);
      r*=1+0.05*Math.sin(a*3+t*17)+0.04*Math.sin(a*7-t*23);
      if(flare){const g=Math.exp(-Math.max(0,c.y)/0.55);r*=1+0.6*g+0.45*Math.exp(-Math.max(0,c.y)/1.1)*Math.max(0,Math.sin(a*5+seed))}
      P.push(c.x+n.x*r,c.y+n.y*r,c.z+n.z*r);N.push(n.x,n.y,n.z);U.push(j/rad,t*L*vs);A.push(moss)}}
  for(let i=0;i<seg;i++)for(let j=0;j<rad;j++){const a=i*(rad+1)+j,b=a+rad+1;I.push(a,a+1,b,b,a+1,b+1)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.setAttribute('aMoss',new THREE.Float32BufferAttribute(A,1));g.setIndex(I);return g}
// a lumpy half (or full) ball
function blob(cx,cy,cz,rx,ry,rz,{moss=1.2,seed=3,full=false}={}){
  const g=new THREE.SphereGeometry(1,40,20,0,Math.PI*2,0,full?Math.PI:Math.PI*0.62);const p=g.attributes.position,rr=mulberry32(seed),o=[rr()*9,rr()*9];
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),th=Math.atan2(z,x),k=1+0.09*Math.sin(th*3+y*2+o[0])+0.06*Math.sin(th*7-y*4+o[1]);
    p.setXYZ(i,cx+x*rx*k,cy+y*ry*k,cz+z*rz*k)}
  g.computeVertexNormals();g.setAttribute('aMoss',new THREE.Float32BufferAttribute(new Array(p.count).fill(moss),1));g.deleteAttribute('uv');
  const uv=[];for(let i=0;i<p.count;i++)uv.push(p.getX(i)*0.5,p.getY(i)*0.5+p.getZ(i)*0.5);g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));return g}
function rockGeo(x,z,r0,flat,seed){const g0=new THREE.IcosahedronGeometry(r0,4);g0.deleteAttribute('normal');g0.deleteAttribute('uv');
  const g=mergeVertices(g0),p=g.attributes.position,v=new THREE.Vector3(),rr=mulberry32(seed),o=[rr()*10,rr()*10,rr()*10];
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=v.clone().normalize();
    const k=1+0.18*Math.sin(n.x*3+o[0])*Math.sin(n.y*4+o[1])+0.1*Math.sin(n.z*7+o[2])+0.05*Math.sin(n.x*13+n.y*11);
    v.copy(n).multiplyScalar(r0*k);v.y*=flat;if(v.y<-r0*0.2)v.y=-r0*0.2;p.setXYZ(i,v.x+x,v.y+groundY(x,z),v.z+z)}
  g.computeVertexNormals();const uv=[];for(let i=0;i<p.count;i++)uv.push(p.getX(i)*1.3+p.getZ(i)*0.6,p.getY(i)*1.3);g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('aMoss',new THREE.Float32BufferAttribute(new Array(p.count).fill(1.1),1));return g}

const mossy=[];   // every geometry that gets moss shells
const casters=[];
function add(geo,m,{cast=true,moss=true}={}){const me=new THREE.Mesh(geo,m);me.castShadow=cast;if(cast)casters.push(me);me.receiveShadow=true;world.add(me);if(moss)mossy.push(geo);return me}

// ---------- the layout (the old forest's, sized so it frames a portrait phone) ----------
// two giant trunks either side of the landing spot, running up off the screen
add(tube([[-2.4,-0.3,-1.3],[-2.45,6,-1.4],[-2.3,14,-1.5],[-2.35,24,-1.6]],0.9,0.62,{seed:1}),M.bark);
add(tube([[2.55,-0.3,-1.9],[2.6,7,-2.0],[2.45,15,-2.1],[2.5,24,-2.2]],0.85,0.6,{seed:4}),M.bark2);
// the big diagonal branch on the right, rising back and left
add(tube([[4.3,-0.3,-0.6],[3.7,2.6,-2.6],[2.6,6,-5.4],[1.2,10.5,-8],[0.2,16,-10]],0.95,0.6,{seed:7}),M.bark);
// the long arch behind
add(tube([[-7.5,-0.3,-6.5],[-5.6,3.6,-7.6],[-2.2,6.4,-8.6],[1.6,6.0,-9.4],[4.6,3.4,-10],[6.4,-0.3,-10.6]],1.25,0.85,{seed:9}),M.bark2);
// a low root arch at the left, near him
add(tube([[-3.6,-0.2,-2.6],[-2.9,1.2,-2.9],[-1.6,1.55,-3.1],[-0.5,0.7,-3.0],[-0.1,-0.2,-2.9]],0.42,0.33,{seed:2,seg:40,rad:18}),M.bark);
// thin branches crossing above him (the old fall's branches)
add(tube([[2.3,6.2,-1.9],[0.9,6.45,-1.6],[-0.6,6.4,-1.4],[-1.9,6.1,-1.4]],0.2,0.09,{seed:5,seg:40,rad:12,flare:false,moss:0.9}),M.bark);
add(tube([[-2.2,4.0,-1.4],[-0.9,4.25,-1.15],[0.4,4.3,-1.0],[1.4,4.1,-1.0]],0.16,0.08,{seed:6,seg:40,rad:12,flare:false,moss:0.9}),M.bark2);
// more mossy trunks in the middle distance
for(const [x,z,r,s,mm] of [[-5.6,-4.5,1.0,11,M.bark],[6.8,-5,1.1,12,M.bark2],[-9,-9,1.3,13,M.bark2],[9.5,-12,1.4,14,M.bark],[-3.5,-13,1.2,15,M.bark]])
  add(tube([[x,-0.3,z],[x+0.1,8,z-0.1],[x-0.1,16,z-0.2],[x,26,z-0.3]],r,r*0.7,{seed:s,seg:44,rad:20}),mm);
// the fallen log (the game's first platform) and the hanging vines
add(tube([[1.0,0.3,-0.4],[2.6,0.36,-0.3],[4.2,0.32,-0.2],[5.8,0.26,-0.15]],0.38,0.33,{seed:8,seg:40,rad:18,flare:false,moss:1.2}),M.bark);
for(const [x,z,y1,s] of [[-1.3,-1.6,2.2,21],[1.5,-2.6,3.0,22],[-4.0,-3.0,1.2,23],[3.6,-3.8,1.8,24],[0.4,-5.5,2.6,25]]){
  const pts=[];for(let i=0;i<=6;i++){const t=i/6;pts.push([x+Math.sin(t*3+s)*0.25,20-(20-y1)*t,z+Math.cos(t*2+s)*0.2])}
  add(tube(pts,0.05,0.04,{seed:s,seg:60,rad:7,flare:false,moss:0.8,vs:1}),M.vine)}
// mounds at the bottom corners and in the middle distance
add(blob(-3.6,-0.5,2.0,2.2,1.4,1.6,{seed:31}),M.mound);add(blob(3.8,-0.6,2.2,2.4,1.5,1.7,{seed:32}),M.mound);
add(blob(-1.6,-0.4,-4.4,2.0,0.85,1.4,{seed:33}),M.mound);add(blob(5.2,-0.4,-5.6,3.0,1.2,2.0,{seed:34}),M.mound);
add(blob(-6.6,-0.4,-1.8,2.6,1.0,1.8,{seed:35}),M.mound);add(blob(1.8,-0.5,-12,4.2,1.6,2.8,{seed:36}),M.mound);
// rocks
add(rockGeo(-1.0,1.3,0.32,0.7,3),M.mossrock);add(rockGeo(1.5,1.6,0.22,0.8,5),M.rock,{moss:false});add(rockGeo(3.1,-0.9,0.45,0.6,9),M.mossrock);
// a ground moss carpet in patches around the landing spot (its own patch so the shells don't cover the whole ground)
{const g=new THREE.PlaneGeometry(16,12,96,72);g.rotateX(-Math.PI/2);g.translate(0,0,-1.5);const p=g.attributes.position;
  for(let i=0;i<p.count;i++)p.setY(i,groundY(p.getX(i),p.getZ(i))+0.002);g.computeVertexNormals();
  g.setAttribute('aMoss',new THREE.Float32BufferAttribute(new Array(p.count).fill(0.55),1));mossy.push(g)}
// far trunks and arches: silhouettes in the fog, no moss

function startLanding(){seq={t:0};if(puli){puli.position.set(LAND.x,7,LAND.z);play('fallloop',0.1)}fogK=0;$('state').textContent='Falling'}
function runLanding(dt){
  seq.t+=dt;const t=seq.t;G.uSeq.value=1;G.uCenter.value.copy(LAND);
  if(t<FALL){const u=t/FALL;if(puli)puli.position.y=7*(1-u*u);G.uW1.value=0;G.uW2.value=0;return}
  if(!seq.landed){seq.landed=true;if(puli){puli.position.y=LAND.y;play('fall',0.06,true)}}
  const tl=t-FALL;
  const u1=Math.min(Math.max((tl-IMPACT)/SET.w1,0),1);G.uW1.value=u1>0?W1MAX*(1-Math.pow(1-u1,2.4)):0;   // bursts out, slows as it climbs
  if(u1>0&&!seq.s1){seq.s1=true;$('state').textContent='Shockwave 1'}
  if(tl>UP&&!seq.up){seq.up=true;play('getup',0.25,true)}
  const t2=tl-UP-0.35,u2=Math.min(Math.max(t2/SET.w2,0),1);
  G.uW2.value=u2>0?W2MAX*Math.pow(u2,1.45):0;                      // starts slow under him, then sweeps out
  fogK=u2*u2*(3-2*u2);                                              // the air thickens with it
  if(u2>0&&!seq.s2){seq.s2=true;$('state').textContent='Shockwave 2'}
  if(u2>=1&&u1>=1){G.uSeq.value=0;$('state').textContent=theme==='day'?'Day':'Night'}
  if(tl>UP+5.2&&!seq.idle){seq.idle=true;play('idle',0.5);seq=null}
}

// ---------- controls ----------
$('landing').onclick=()=>startLanding();
$('day').onclick=()=>{theme='day';applyLook();if(!seq)$('state').textContent='Day'};
$('night').onclick=()=>{theme='night';applyLook();if(!seq)$('state').textContent='Night'};
const sheet=$('sheet');
function openSheet(o){sheet.classList.toggle('open',o);$('tweak').setAttribute('aria-expanded',o)}
$('tweak').onclick=()=>openSheet(!sheet.classList.contains('open'));$('close').onclick=()=>openSheet(false);
for(const [k,label,min,max,step,fmt] of ROWS){const row=document.createElement('div');row.className='row';
  row.innerHTML=`<label for="s-${k}">${label}</label><output id="o-${k}">${fmt(SET[k])}</output><input id="s-${k}" type="range" min="${min}" max="${max}" step="${step}" value="${SET[k]}">`;
  $('rows').append(row);row.querySelector('input').oninput=e=>{SET[k]=+e.target.value;$('o-'+k).textContent=fmt(SET[k]);applySet()}}
function applySet(){G.uMossLen.value=SET.mossLen;G.uShells.value=SET.shells;G.uCurl.value=SET.curl;moss.count=SET.shells+1;G.uGrassH.value=SET.grassH;
  grass.geometry.instanceCount=Math.round(GRASS_MAX*SET.grass)}
applySet();

// ---------- camera: drag to look around ----------
let yaw=0,pitch=0,drag=null;
R.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};R.domElement.setPointerCapture(e.pointerId)});
R.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw=Math.max(-1,Math.min(1,drag.yaw+(e.clientX-drag.x)*0.005));pitch=Math.max(-0.2,Math.min(0.9,drag.pitch+(e.clientY-drag.y)*0.004))});
addEventListener('pointerup',()=>drag=null);
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<0.8?54:36;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();

const clock=new THREE.Clock(),tgt=new THREE.Vector3();
function frame(){
  const dt0=Math.min(clock.getDelta(),0.05),dt=window.__dt??dt0,now=clock.elapsedTime;G.uTime.value=now;
  if(seq)runLanding(dt);
  const L=LOOK[theme],fd=L.fogD*SET.fog*fogK;scene.fog.density=fd;G.uFogD.value=fd;
  skyMat.color.set(L.sky).multiplyScalar(seq?fogK:1);
  const settled=!seq||G.uW2.value>W2MAX*0.6;
  const shade=!seq||G.uW2.value>0;for(const c of casters)c.castShadow=shade;   // the hidden forest casts no shadow on him in the dark
  flowers.visible=settled;pollen.visible=settled&&theme==='day';fireflies.visible=settled&&theme==='night';
  for(const P of [pollen,fireflies])if(P.visible){const a=P.geometry.attributes.position.array,b=P.userData.base;
    for(let i=0;i<a.length;i+=3){a[i]=b[i]+Math.sin(now*0.3+i)*0.4;a[i+1]=b[i+1]+Math.sin(now*0.5+i*1.3)*0.25;a[i+2]=b[i+2]+Math.cos(now*0.27+i*0.7)*0.4}
    P.geometry.attributes.position.needsUpdate=true}
  fireflies.material.opacity=0.6+0.4*Math.sin(now*2.6);
  if(mixer)mixer.update(dt);
  const d=cam.aspect<0.8?7.6:7.8;tgt.set(0,1.45,-0.6);
  cam.position.set(tgt.x+Math.sin(yaw)*d*Math.cos(pitch),tgt.y-0.25+Math.sin(pitch)*d,tgt.z+Math.cos(yaw)*d*Math.cos(pitch));
  cam.lookAt(tgt.x,tgt.y+pitch*4,tgt.z);
  R.render(scene,cam);requestAnimationFrame(frame)}
THREE.DefaultLoadingManager.onLoad=()=>{$('load')?.remove();if(!seq)$('state').textContent=theme==='day'?'Day':'Night'};
window.__f={G,SET,startLanding,adv(sec){for(let k=0;k<sec*30;k++){if(seq)runLanding(1/30);if(mixer)mixer.update(1/30)}},get seq(){return seq},set theme(v){theme=v;applyLook()}};
frame();
</script>
