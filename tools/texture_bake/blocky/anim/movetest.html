<title>Puli Move Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a one-screen stage (the character) with the moves as a grid of chips under it; the site's Charcoal/Moss palette. */
:root{
  --bg:#CFCFCB; --bg-deep:#BDBDB8; --text:#1F1F1F; --soft:rgba(31,31,31,.66); --accent:#D21319; --on-accent:#fff;
  --chip:#F2F2EF; --chip-line:rgba(31,31,31,.14); --floor:rgba(31,31,31,.18);
  --display:"Playfair Display", Georgia, "Times New Roman", serif; --sans:"Inter", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1410; --bg-deep:#142019; --text:#E2E8D6; --soft:rgba(226,232,214,.66); --accent:#E8361F; --on-accent:#fff;
  --chip:#1B231E; --chip-line:rgba(226,232,214,.14); --floor:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1410; --bg-deep:#142019; --text:#E2E8D6; --soft:rgba(226,232,214,.66); --accent:#E8361F; --on-accent:#fff;
  --chip:#1B231E; --chip-line:rgba(226,232,214,.14); --floor:rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);background-color:var(--bg);color:var(--text);font-family:var(--sans);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 4px}
h1{font:500 clamp(22px,5vw,30px)/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.now{font:500 12px/1.3 var(--sans);color:var(--soft);text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-align:right}
.stage{position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:absolute;left:0;bottom:6px;font-size:12px;color:var(--soft)}
.load{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--soft)}
.controls{display:flex;flex-direction:column;gap:10px;padding-block:8px 16px}
.story{appearance:none;border:0;border-radius:999px;min-height:46px;padding:0 20px;background:var(--accent);color:var(--on-accent);
  font:600 15px/1 var(--sans);cursor:pointer}
.story:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--chip-line);background:var(--chip);color:var(--text);border-radius:999px;min-height:38px;padding:0 14px;
  font:500 13px/1 var(--sans);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.group{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--soft);margin:2px 0 -2px}
@media (min-width:900px){.controls{max-width:860px;margin:0 auto;width:100%}}
</style>

<header>
  <h1>Puli, all moves</h1>
  <div class="now" id="now">Loading…</div>
</header>
<div class="stage">
  <canvas id="cv" aria-label="Puli, the blocky character. Drag to turn him around."></canvas>
  <div class="load" id="load">Loading Puli (4 MB)…</div>
  <div class="hint">Drag to turn him around</div>
</div>
<div class="controls">
  <button class="story" id="story">Play the section 5 idea</button>
  <div class="group">Section 5</div>
  <div class="grid" id="grid"></div>
  <div class="group">The game</div>
  <div class="grid" id="grid2"></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const MOVES=[['idle','Idle'],['walk','Walk'],['moonwalk','Moonwalk'],['dance','Hip-hop dance'],['jump','Jump'],['grab','Jump and grab'],
  ['hang','Hang'],['fallloop','Falling'],['fall','Fall and land'],['getup','Get up'],['run','Run'],['runjump','Running jump'],['slide','Slide']];
const LOOP=new Set(['idle','walk','moonwalk','dance','hang','fallloop','run']);

const cv=document.getElementById('cv'),nowEl=document.getElementById('now');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8a80,2.1));
const sun=new THREE.DirectionalLight(0xfff4e6,1.7);sun.position.set(1.2,2.4,2.2);scene.add(sun);
const cam=new THREE.PerspectiveCamera(30,1,0.05,50);
// soft floor shadow
const sc=document.createElement('canvas');sc.width=sc.height=128;const sx=sc.getContext('2d');
const gr=sx.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(0,0,0,.45)');gr.addColorStop(1,'rgba(0,0,0,0)');sx.fillStyle=gr;sx.fillRect(0,0,128,128);
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(.75,.75),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;scene.add(shadow);
// the "Catch me" button for the story
const bc=document.createElement('canvas');bc.width=256;bc.height=96;const bx=bc.getContext('2d');
bx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#D21319';
bx.beginPath();bx.roundRect(4,4,248,88,44);bx.fill();bx.fillStyle='#fff';bx.font='600 38px Inter, Arial, sans-serif';bx.textAlign='center';bx.textBaseline='middle';bx.fillText('Catch me',128,50);
const btn=new THREE.Mesh(new THREE.PlaneGeometry(.42,.16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bc),transparent:true}));
btn.material.map.colorSpace=THREE.SRGBColorSpace;btn.visible=false;scene.add(btn);

let puli,mixer,clips={},cur=null,story=null,yaw=0.35,drag=null;
function size(){const r=cv.getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/Math.max(1,r.height);cam.updateProjectionMatrix()}
addEventListener('resize',size);
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:yaw};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag)yaw=drag.y+(e.clientX-drag.x)*0.01});
cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);

function play(name,fade=0.25,once){
  const a=mixer.clipAction(clips[name]);
  a.reset();a.setLoop(LOOP.has(name)&&!once?THREE.LoopRepeat:THREE.LoopOnce,Infinity);a.clampWhenFinished=true;
  if(cur&&cur!==a){a.crossFadeFrom(cur,fade,false)}a.play();cur=a;
  nowEl.textContent=MOVES.find(m=>m[0]===name)[1]+' · '+clips[name].duration.toFixed(1)+' s';
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.m===name));
}

const grid=document.getElementById('grid'),grid2=document.getElementById('grid2');const GAME=new Set(['run','runjump','slide']);
for(const [k,label] of MOVES){const b=document.createElement('button');b.className='chip';b.textContent=label;b.dataset.m=k;b.id='m-'+k;
  b.setAttribute('aria-pressed','false');b.onclick=()=>{if(!puli)return;stopStory();puli.position.set(0,0,0);puli.rotation.y=0;play(k)};(GAME.has(k)?grid2:grid).append(b)}

// ---- the section 5 idea, as a timed sequence ----
// The entrance is the Moonwalk clip, then a hard cut into the dance at 7.57 s, where the dance does the same moonwalk
// (the two poses match almost exactly: moonwalk 0.40 s = dance 7.57 s). He glides in facing left, passes behind the
// button, and the dance's spin (9.2-10.4 s of the dance) turns him to face the viewer.
const BTN_X=-0.45, BTN_Z=0.7, MW_SPEED=0.46, MW_LEAD=0.40+3*1.0167, SWITCH_X=-0.18, DANCE_IN=7.57, SPIN=[9.2,10.4];
const hipsWorld=()=>{puli.updateMatrixWorld(true);return puli.getObjectByName('mixamorigHips').getWorldPosition(new THREE.Vector3())};
function keepHips(change){const p0=hipsWorld();change();mixer.update(0);const p1=hipsWorld();puli.position.x+=p0.x-p1.x;puli.position.z+=p0.z-p1.z}
function stopStory(){story=null;btn.visible=false;document.getElementById('story').textContent='Play the section 5 idea'}
document.getElementById('story').onclick=()=>{
  if(!puli)return;
  if(story){stopStory();puli.position.set(0,0,0);puli.rotation.y=0;play('idle');return}
  story={t:0,phase:'enter'};document.getElementById('story').textContent='Stop';yaw=0;
  puli.position.set(SWITCH_X-MW_SPEED*MW_LEAD,0,0);puli.rotation.y=-Math.PI/2;
  btn.visible=true;btn.position.set(BTN_X,0.85,BTN_Z);play('moonwalk',0);
};
function runStory(dt){
  const S=story;S.t+=dt;
  if(S.phase==='enter'){
    puli.position.x+=MW_SPEED*dt;
    if(S.t>=MW_LEAD){            // same pose in both clips: cut straight into the dance and keep his hips where they are
      keepHips(()=>{play('dance',0,true);cur.time=DANCE_IN});S.phase='dance';
    }
  }else if(S.phase==='dance'){
    const dt_=cur.time;
    if(dt_>=SPIN[0]&&dt_<=SPIN[1]+0.05){   // turn to face the viewer during his spin, pivoting on the hips
      const u=Math.min(1,(dt_-SPIN[0])/(SPIN[1]-SPIN[0]));const target=-Math.PI/2*(1-u*u*(3-2*u));
      keepHips(()=>{puli.rotation.y=target});
    }
    if(dt_>=clips.dance.duration-0.05){keepHips(()=>play('idle',0.4));S.phase='call';S.t0=S.t;S.bx=btn.position.x}
  }else if(S.phase==='call'){     // the button floats over above his head, then he jumps for it
    const u=Math.min(1,(S.t-S.t0)/1.0),hx=hipsWorld().x;btn.position.x=S.bx+(hx-S.bx)*u*u*(3-2*u);btn.position.y=0.85+0.35*u;
    if(S.t-S.t0>1.4){keepHips(()=>play('grab',0.2,true));S.phase='grab';S.t0=S.t}
  }else if(S.phase==='grab'){
    if(S.t-S.t0>1.05){play('hang',0.25);S.phase='fly';S.t0=S.t;S.y0=puli.position.y}
  }else if(S.phase==='fly'){
    const u=Math.max(0,(S.t-S.t0-0.4)/2.2);puli.position.y=S.y0+u*u*3.6;btn.position.y=1.2+u*u*3.6+0.0;
    if(S.t-S.t0>2.6){btn.visible=false;play('fallloop',0.2);S.phase='drop';S.t0=S.t}
  }else if(S.phase==='drop'){
    const u=Math.min(1,(S.t-S.t0)/1.5);puli.position.y=3.4*(1-u*u);
    if(u>=1){puli.position.y=0;play('fall',0.1,true);S.phase='land';S.t0=S.t}
  }else if(S.phase==='land'){
    if(S.t-S.t0>1.6){keepHips(()=>play('getup',0.2,true));S.phase='up';S.t0=S.t}
  }else if(S.phase==='up'){
    if(S.t-S.t0>5.1){keepHips(()=>play('idle',0.5));S.phase='end';S.t0=S.t}
  }else if(S.phase==='end'&&S.t-S.t0>2.5){stopStory()}
}

const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05);
  if(mixer){if(story)runStory(dt);mixer.update(dt);const hw=hipsWorld();shadow.position.set(hw.x,0.001,hw.z);
    const h=Math.max(0,hw.y-0.46);shadow.scale.setScalar(1/(1+h));shadow.material.opacity=1/(1+h*2)}
  const d=3.4;cam.position.set(Math.sin(yaw)*d,0.62,Math.cos(yaw)*d);cam.lookAt(0,0.5,0);
  R.render(scene,cam);requestAnimationFrame(frame)}

size();
new GLTFLoader().load('puli.wasm',g=>{  // a .glb under a .wasm name: the host only serves standard web file types
  puli=g.scene;puli.traverse(o=>{if(o.isMesh){o.frustumCulled=false}});scene.add(puli);
  mixer=new THREE.AnimationMixer(puli);for(const c of g.animations)clips[c.name]=c;
  document.getElementById('load').remove();play('idle',0);
},undefined,()=>{document.getElementById('load').textContent='Puli did not load. Reload the page to try again.'});
frame();
</script>
