<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const W=200,H=280;
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});

  const cam=new THREE.OrthographicCamera(-0.62*W/H,0.62*W/H,0.62,-0.62,0.01,50);cam.position.set(Math.sin(0.6)*5,0.5,Math.cos(0.6)*5);cam.lookAt(0,0.5,0);r.render(scene,cam);return true};
window.ready=true;
</script></body></html>
